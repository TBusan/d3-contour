<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Enhanced Contour Visualization</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      background-color: white;
      padding: 20px;
      border-radius: 5px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
    }
    .controls {
      margin-bottom: 20px;
      padding: 15px;
      background-color: #f0f0f0;
      border-radius: 5px;
    }
    .control-group {
      margin-bottom: 10px;
    }
    h1 {
      margin-top: 0;
      color: #333;
    }
    h2 {
      color: #555;
      margin-top: 30px;
    }
    label {
      display: inline-block;
      width: 150px;
      font-weight: bold;
    }
    input[type="range"] {
      width: 200px;
      vertical-align: middle;
    }
    .value-display {
      display: inline-block;
      width: 50px;
      text-align: right;
    }
    select {
      padding: 5px;
      width: 200px;
    }
    button {
      padding: 8px 15px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-right: 10px;
    }
    button:hover {
      background-color: #45a049;
    }
    .info {
      font-family: monospace;
      background-color: #eee;
      padding: 10px;
      border-radius: 4px;
      margin-top: 10px;
    }
    svg {
      width: 100%;
      height: 500px;
      border: 1px solid #ccc;
      background-color: #fff;
    }
    .contour {
      stroke: #000;
      stroke-opacity: 0.8;
      stroke-width: 1px;
      fill: none;
    }
    .contour-band {
      stroke: #000;
      stroke-opacity: 0.1;
      stroke-width: 0.5px;
      fill-opacity: 0.7;
    }
    .axis path,
    .axis line {
      fill: none;
      stroke: #000;
      shape-rendering: crispEdges;
    }
    .axis text {
      font-size: 11px;
    }
    .legend {
      font-size: 12px;
      margin-top: 10px;
    }
    .tabs {
      display: flex;
      margin-bottom: 10px;
      gap: 4px;
    }
    .tab {
      padding: 10px 20px;
      cursor: pointer;
      background-color: #ddd;
      border: none;
      border-radius: 4px 4px 0 0;
    }
    .tab.active {
      background-color: #4CAF50;
      color: white;
    }
    .checkbox-group {
      margin: 10px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Enhanced Contour Visualization</h1>
    <p>Visualizing the test data using the improved enhanced-contour.js implementation</p>
    
    <div class="tabs">
      <button class="tab active" onclick="switchTab('contours')">Contour Lines</button>
      <button class="tab" onclick="switchTab('bands')">Contour Bands</button>
      <button class="tab" onclick="switchTab('combined')">Combined View</button>
    </div>
    
    <div class="controls">
      <div class="control-group">
        <label for="threshold-count">Threshold Count:</label>
        <input type="range" id="threshold-count" min="5" max="30" value="15">
        <span id="threshold-count-value" class="value-display">15</span>
      </div>
      
      <div class="control-group band-control">
        <label for="band-count">Band Count:</label>
        <input type="range" id="band-count" min="3" max="20" value="10">
        <span id="band-count-value" class="value-display">10</span>
      </div>
      
      <div class="control-group">
        <label for="color-scheme">Color Scheme:</label>
        <select id="color-scheme">
          <option value="viridis">Viridis</option>
          <option value="inferno">Inferno</option>
          <option value="magma">Magma</option>
          <option value="plasma">Plasma</option>
          <option value="warm">Warm</option>
          <option value="cool">Cool</option>
          <option value="rainbow">Rainbow</option>
        </select>
      </div>

      <div class="checkbox-group combined-control" style="display: none;">
        <label><input type="checkbox" id="show-bands" checked> Show Bands</label>
        <label><input type="checkbox" id="show-contours" checked> Show Contour Lines</label>
      </div>
      
      <div class="control-group">
        <button id="update-btn">Update Visualization</button>
        <button id="reset-view-btn">Reset View</button>
      </div>
    </div>
    
    <div class="visualization">
      <div id="contours-container" class="viz-container">
        <h2>Contour Lines</h2>
        <svg id="contours-svg"></svg>
      </div>
      
      <div id="bands-container" class="viz-container" style="display: none;">
        <h2>Contour Bands</h2>
        <svg id="bands-svg"></svg>
      </div>

      <div id="combined-container" class="viz-container" style="display: none;">
        <h2>Combined View</h2>
        <svg id="combined-svg"></svg>
      </div>
      
      <div class="info" id="data-info">
        Loading data...
      </div>
    </div>
  </div>
  
  <script type="module">
    // Import D3
    import * as d3 from "https://cdn.jsdelivr.net/npm/d3@7/+esm";
    import { generateContours, generateContourBands, generateContourAndBands } from './tmp2.js';
    import { contourData } from './data/testData1.js';
    
    // Reference to SVG and info elements
    const contoursSvg = d3.select('#contours-svg');
    const bandsSvg = d3.select('#bands-svg');
    const combinedSvg = d3.select('#combined-svg');
    const dataInfo = document.getElementById('data-info');
    
    // UI Elements
    const thresholdCountInput = document.getElementById('threshold-count');
    const thresholdCountValue = document.getElementById('threshold-count-value');
    const bandCountInput = document.getElementById('band-count');
    const bandCountValue = document.getElementById('band-count-value');
    const colorSchemeSelect = document.getElementById('color-scheme');
    const showBandsCheckbox = document.getElementById('show-bands');
    const showContoursCheckbox = document.getElementById('show-contours');
    const updateBtn = document.getElementById('update-btn');
    const resetViewBtn = document.getElementById('reset-view-btn');
    
    // Update threshold/band count display
    thresholdCountInput.addEventListener('input', () => {
      thresholdCountValue.textContent = thresholdCountInput.value;
    });
    
    bandCountInput.addEventListener('input', () => {
      bandCountValue.textContent = bandCountInput.value;
    });
    
    // Update visualization when checkboxes change
    showBandsCheckbox.addEventListener('change', updateVisualization);
    showContoursCheckbox.addEventListener('change', updateVisualization);
    
    // Update button click handler
    updateBtn.addEventListener('click', updateVisualization);
    
    // Reset view button click handler
    resetViewBtn.addEventListener('click', resetView);
    
    // Current visualization mode
    let currentMode = 'contours';
    
    // Zoom behavior
    const zoom = d3.zoom()
      .scaleExtent([0.1, 10])
      .on('zoom', zoomed);
    
    // Apply zoom behavior to all SVGs
    contoursSvg.call(zoom);
    bandsSvg.call(zoom);
    combinedSvg.call(zoom);
    
    // Create groups for zoom transformation
    const contoursGroup = contoursSvg.append('g');
    const bandsGroup = bandsSvg.append('g');
    const combinedGroup = combinedSvg.append('g');
    
    // Zoom handler function
    function zoomed(event) {
      const { transform } = event;
      
      // 同步所有视图的缩放和平移
      contoursGroup.attr('transform', transform);
      bandsGroup.attr('transform', transform);
      combinedGroup.attr('transform', transform);
    }
    
    // Reset view function
    function resetView() {
      const resetTransform = d3.zoomIdentity;
      contoursSvg.transition().duration(750).call(zoom.transform, resetTransform);
      bandsSvg.transition().duration(750).call(zoom.transform, resetTransform);
      combinedSvg.transition().duration(750).call(zoom.transform, resetTransform);
    }
    
    // Make switchTab function available globally
    window.switchTab = function(mode) {
      currentMode = mode;
      
      // Update tab styling
      document.querySelectorAll('.tab').forEach(tab => {
        tab.classList.remove('active');
      });
      document.querySelector(`.tab[onclick*="${mode}"]`).classList.add('active');
      
      // Show/hide containers
      document.getElementById('contours-container').style.display = mode === 'contours' ? 'block' : 'none';
      document.getElementById('bands-container').style.display = mode === 'bands' ? 'block' : 'none';
      document.getElementById('combined-container').style.display = mode === 'combined' ? 'block' : 'none';
      
      // Show/hide controls
      document.querySelector('.band-control').style.display = mode === 'contours' ? 'none' : 'block';
      document.querySelector('.combined-control').style.display = mode === 'combined' ? 'block' : 'none';
      
      // Update visualization if data is loaded
      if (contourData) {
        updateVisualization();
      }
    };
    
    // Map color scheme names to d3 interpolators
    const colorSchemes = {
      viridis: d3.interpolateViridis,
      inferno: d3.interpolateInferno,
      magma: d3.interpolateMagma,
      plasma: d3.interpolatePlasma,
      warm: d3.interpolateWarm,
      cool: d3.interpolateCool,
      rainbow: d3.interpolateRainbow
    };
    
    // Initialize the visualization
    async function initVisualization() {
      try {
        // Now that we have the data, update the visualization
        updateVisualization();
        
        // Initialize the UI based on the current mode
        switchTab(currentMode);
      } catch (error) {
        console.error('Error loading test data:', error);
        dataInfo.innerHTML = `Error loading test data: ${error.message}`;
      }
    }
    
    // Prepare 2D grid data from the contourData object
    function prepare2DGridData() {
      const gridWidth = contourData.data.x.length;
      const gridHeight = contourData.data.y.length;
      const grid = [];
      
      // Create 2D grid
      for (let y = 0; y < gridHeight; y++) {
        const row = [];
        for (let x = 0; x < gridWidth; x++) {
          row.push(contourData.data.v[y][x]);
        }
        grid.push(row);
      }
      
      return grid;
    }
    
    // Generate thresholds based on the data range
    function generateThresholds(count) {
      const min = contourData.data.zmin;
      const max = contourData.data.zmax;
      return Array.from({ length: count }, (_, i) => min + (max - min) * i / (count - 1));
    }

    // Transform coordinates from grid to SVG space
    function transformCoordinates(point, gridWidth, gridHeight, xScale, yScale) {
      // 直接使用数据点的原始坐标，而不是网格索引
      // 将点的位置从[0,gridWidth]x[0,gridHeight]映射到实际数据坐标
      const x = point[0] / (gridWidth - 1) * (contourData.data.x[gridWidth - 1] - contourData.data.x[0]) + contourData.data.x[0];
      const y = point[1] / (gridHeight - 1) * (contourData.data.y[gridHeight - 1] - contourData.data.y[0]) + contourData.data.y[0];
      
      // 使用比例尺将数据坐标映射到SVG空间
      return [xScale(x), yScale(y)];
    }
    
    // Transform contour coordinates
    function transformContourCoordinates(coordinates, gridWidth, gridHeight, xScale, yScale) {
      return coordinates.map(contour => {
        return contour.map(point => transformCoordinates(point, gridWidth, gridHeight, xScale, yScale));
      });
    }
    
    // Transform band coordinates
    function transformBandCoordinates(coordinates, gridWidth, gridHeight, xScale, yScale) {
      return coordinates.map(polygon => {
        return polygon.map(ring => {
          return ring.map(point => transformCoordinates(point, gridWidth, gridHeight, xScale, yScale));
        });
      });
    }
    
    // Render contour lines to an SVG
    function renderContourLines(group, contourResults, colorScale, gridWidth, gridHeight, xScale, yScale) {
      // 确保contourResults是数组
      const resultsArray = Array.isArray(contourResults) ? contourResults : [contourResults];
      
      resultsArray.forEach(result => {
        const transformedCoordinates = transformContourCoordinates(
          result.coordinates, 
          gridWidth, 
          gridHeight, 
          xScale, 
          yScale
        );
        
        // Create line generator
        const lineGenerator = d3.line()
          .x(d => d[0])
          .y(d => d[1])
          .curve(d3.curveBasis); // Use basis interpolation for smoother lines
        
        group.append('g')
          .selectAll('path')
          .data(transformedCoordinates)
          .enter()
          .append('path')
          .attr('d', lineGenerator)
          .attr('stroke', colorScale(result.threshold))
          .attr('stroke-width', 0.5)
          .attr('fill', 'none')
          .attr('class', 'contour');
      });
    }
    
    // Render contour bands to an SVG
    function renderContourBands(group, bandResults, colorScale, gridWidth, gridHeight, xScale, yScale) {
      // Create path generator for bands
      const pathGenerator = d3.geoPath();
      
      // 确保bandResults是数组
      const resultsArray = Array.isArray(bandResults) ? bandResults : [bandResults];
      
      resultsArray.forEach((result, i) => {
        // 使用阈值来确定颜色
        const color = colorScale(result.threshold);
        const transformedCoordinates = transformBandCoordinates(
          result.coordinates, 
          gridWidth, 
          gridHeight, 
          xScale, 
          yScale
        );
        
        // Create GeoJSON compatible objects for the bands
        const geoJSONPolygons = transformedCoordinates.map(polygon => {
          return {
            type: "Polygon",
            coordinates: polygon
          };
        });
        
        // Render each band
        group.append('g')
          .selectAll('path')
          .data(geoJSONPolygons)
          .enter()
          .append('path')
          .attr('d', pathGenerator)
          .attr('fill', color)
          .attr('stroke', '#000')
          .attr('stroke-width', 0.5)
          .attr('stroke-opacity', 0.3)
          .attr('class', 'contour-band');
      });
    }
    
    // Setup axes for an SVG
    function setupAxes(svg, xScale, yScale) {
      // Create axes
      const xAxis = d3.axisBottom(xScale);
      const yAxis = d3.axisLeft(yScale);
      
      // Add X axis
      svg.append('g')
        .attr('class', 'axis x-axis')
        .attr('transform', `translate(0, ${svg.node().clientHeight - 50})`)
        .call(xAxis);
      
      // Add Y axis
      svg.append('g')
        .attr('class', 'axis y-axis')
        .attr('transform', 'translate(50, 0)')
        .call(yAxis);
    }
    
    // Update the visualization based on current settings
    function updateVisualization() {
      // Check if data is loaded
      if (!contourData) {
        dataInfo.innerHTML = "Data not loaded yet...";
        return;
      }
      
      // Get the current settings
      const thresholdCount = parseInt(thresholdCountInput.value);
      const colorScheme = colorSchemeSelect.value;
      
      // Prepare the data as 2D grid
      const gridData = prepare2DGridData();
      
      // Get grid dimensions
      const gridWidth = contourData.data.x.length;
      const gridHeight = contourData.data.y.length;
      
      // Clear the SVGs
      contoursGroup.selectAll('*').remove();
      bandsGroup.selectAll('*').remove();
      combinedGroup.selectAll('*').remove();
      
      contoursSvg.selectAll('.axis').remove();
      bandsSvg.selectAll('.axis').remove();
      combinedSvg.selectAll('.axis').remove();
      
      // 确保所有SVG元素具有相同的尺寸
      const svgWidth = contoursSvg.node().clientWidth;
      const svgHeight = contoursSvg.node().clientHeight;
      
      bandsSvg.attr('width', svgWidth).attr('height', svgHeight);
      combinedSvg.attr('width', svgWidth).attr('height', svgHeight);
      
      // 为所有视图设置完全相同的X和Y轴比例
      const xMin = d3.min(contourData.data.x);
      const xMax = d3.max(contourData.data.x);
      const yMin = d3.min(contourData.data.y);
      const yMax = d3.max(contourData.data.y);
      
      const xScale = d3.scaleLinear()
        .domain([xMin, xMax])
        .range([50, svgWidth - 50]);
      
      const yScale = d3.scaleLinear()
        .domain([yMin, yMax])
        .range([svgHeight - 50, 50]);
      
      // 创建颜色比例
      const colorScale = d3.scaleSequential(colorSchemes[colorScheme])
        .domain([contourData.data.zmin, contourData.data.zmax]);
      
      // 为所有SVG设置相同的坐标轴
      setupAxes(contoursSvg, xScale, yScale);
      setupAxes(bandsSvg, xScale, yScale);
      setupAxes(combinedSvg, xScale, yScale);
      
      // 生成统一的阈值数组，等值线和等值面使用相同的阈值
      const thresholds = generateThresholds(thresholdCount);
      
      if (currentMode === 'contours' || currentMode === 'combined') {
        // 一次性生成所有阈值的等值线
        const contourResults = generateContours(gridData, thresholds);
        
        // Render contour lines
        if (currentMode === 'contours') {
          renderContourLines(contoursGroup, contourResults, colorScale, gridWidth, gridHeight, xScale, yScale);
        } else if (currentMode === 'combined' && showContoursCheckbox.checked) {
          renderContourLines(combinedGroup, contourResults, colorScale, gridWidth, gridHeight, xScale, yScale);
        }
      }
      
      if (currentMode === 'bands' || currentMode === 'combined') {
        // 一次性生成所有阈值的等值面，使用与等值线相同的阈值
        const bandResults = generateContourBands(gridData, thresholds);
        
        // Render contour bands
        if (currentMode === 'bands') {
          renderContourBands(bandsGroup, bandResults, colorScale, gridWidth, gridHeight, xScale, yScale);
        } else if (currentMode === 'combined' && showBandsCheckbox.checked) {
          renderContourBands(combinedGroup, bandResults, colorScale, gridWidth, gridHeight, xScale, yScale);
        }
      }
      
      // Update data info
      let modeText = '';
      if (currentMode === 'contours') {
        modeText = `Contour Lines (Thresholds: ${thresholdCount})`;
      } else if (currentMode === 'bands') {
        modeText = `Contour Bands (Bands: ${thresholdCount})`;
      } else {
        modeText = `Combined View (Thresholds: ${thresholdCount})`;
      }
      
      dataInfo.innerHTML = `
        Data Range: [${contourData.data.zmin.toFixed(2)}, ${contourData.data.zmax.toFixed(2)}]<br>
        Grid Size: ${gridWidth}×${gridHeight}<br>
        Current Mode: ${modeText}<br>
        <small>Tip: Scroll to zoom, drag to pan, click "Reset View" to reset</small>
      `;
    }
    
    // Initialize the UI based on the current mode
    document.querySelector('.band-control').style.display = currentMode === 'contours' ? 'none' : 'block';
    document.querySelector('.combined-control').style.display = currentMode === 'combined' ? 'block' : 'none';
    
    // Initialize the visualization when the page loads
    window.onload = initVisualization;
  </script>
</body>
</html>
