<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>鞍点处理测试</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
    }
    .chart {
      margin: 10px;
      padding: 10px;
      border: 1px solid #ccc;
      width: 520px;
    }
    h1, h2 {
      color: #333;
    }
    canvas {
      border: 1px solid #ddd;
    }
    .controls {
      margin-bottom: 20px;
    }
    button, select {
      padding: 5px 10px;
      margin-right: 10px;
    }
    .grid-cell {
      stroke: #ccc;
      stroke-width: 0.5;
      fill: none;
    }
    .grid-value {
      font-size: 12px;
      text-anchor: middle;
      dominant-baseline: middle;
    }
  </style>
</head>
<body>
  <h1>鞍点处理测试</h1>
  <p>测试Marching Squares算法中鞍点的处理</p>
  
  <div class="controls">
    <button id="toggleSaddleResolution">切换鞍点解析</button>
    <button id="toggleSaddleType">切换鞍点类型</button>
    <button id="regenerateData">重新生成数据</button>
    <select id="thresholdMode">
      <option value="single">单一阈值 (0.5)</option>
      <option value="multiple">多阈值</option>
    </select>
  </div>
  
  <div class="container">
    <div class="chart">
      <h2>数据网格</h2>
      <svg id="dataGrid" width="500" height="500"></svg>
    </div>
    
    <div class="chart">
      <h2>等值线 (Contour Lines)</h2>
      <canvas id="contourLinesCanvas" width="500" height="500"></canvas>
    </div>
    
    <div class="chart">
      <h2>等值面 (Contour Bands)</h2>
      <canvas id="contourBandsCanvas" width="500" height="500"></canvas>
    </div>
  </div>

  <script type="module">
    import { generateContours } from '../contour-lines.js';
    import { generateContourBands } from '../contour-bands.js';
    
    // 全局变量
    let saddleResolution = true;
    let saddleType = 5; // 5 或 10
    let data = [];
    const gridSize = 10;
    const cellSize = 50;
    
    // 创建包含鞍点的数据
    function createSaddleData(type) {
      const data = new Array(gridSize);
      
      for (let y = 0; y < gridSize; y++) {
        data[y] = new Array(gridSize).fill(0);
      }
      
      // 在中心区域创建鞍点
      const centerX = Math.floor(gridSize / 2);
      const centerY = Math.floor(gridSize / 2);
      
      if (type === 5) {
        // 类型5：左上和右下高于阈值
        data[centerY-1][centerX-1] = 1.0; // 左上
        data[centerY-1][centerX] = 0.0;   // 右上
        data[centerY][centerX] = 1.0;     // 右下
        data[centerY][centerX-1] = 0.0;   // 左下
      } else {
        // 类型10：右上和左下高于阈值
        data[centerY-1][centerX-1] = 0.0; // 左上
        data[centerY-1][centerX] = 1.0;   // 右上
        data[centerY][centerX] = 0.0;     // 右下
        data[centerY][centerX-1] = 1.0;   // 左下
      }
      
      // 添加一些随机数据
      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          // 跳过中心区域
          if ((x === centerX-1 || x === centerX) && (y === centerY-1 || y === centerY)) {
            continue;
          }
          
          // 生成随机值
          data[y][x] = Math.random();
        }
      }
      
      return data;
    }
    
    // 绘制数据网格
    function drawDataGrid(data) {
      const svg = document.getElementById('dataGrid');
      svg.innerHTML = '';
      
      // 计算网格单元格大小
      const width = svg.clientWidth;
      const height = svg.clientHeight;
      const cellWidth = width / gridSize;
      const cellHeight = height / gridSize;
      
      // 绘制网格线和值
      for (let y = 0; y < gridSize; y++) {
        for (let x = 0; x < gridSize; x++) {
          // 创建单元格
          const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          rect.setAttribute('x', x * cellWidth);
          rect.setAttribute('y', y * cellHeight);
          rect.setAttribute('width', cellWidth);
          rect.setAttribute('height', cellHeight);
          rect.setAttribute('class', 'grid-cell');
          
          // 根据值设置背景颜色
          const value = data[y][x];
          const intensity = Math.floor(255 * (1 - value));
          rect.setAttribute('fill', `rgba(0, 0, 255, ${value})`);
          
          svg.appendChild(rect);
          
          // 添加值文本
          const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
          text.setAttribute('x', x * cellWidth + cellWidth / 2);
          text.setAttribute('y', y * cellHeight + cellHeight / 2);
          text.setAttribute('class', 'grid-value');
          text.textContent = value.toFixed(2);
          text.setAttribute('fill', value > 0.5 ? 'white' : 'black');
          
          svg.appendChild(text);
        }
      }
    }
    
    // 绘制等值线
    function drawContourLines(canvas, data, thresholds) {
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      
      ctx.clearRect(0, 0, width, height);
      
      // 根据数据尺寸计算缩放比例
      const scaleX = width / (data[0].length - 1);
      const scaleY = height / (data.length - 1);
      
      // 绘制网格
      ctx.beginPath();
      ctx.strokeStyle = '#ccc';
      ctx.lineWidth = 0.5;
      
      for (let x = 0; x <= data[0].length; x++) {
        ctx.moveTo(x * scaleX, 0);
        ctx.lineTo(x * scaleX, height);
      }
      
      for (let y = 0; y <= data.length; y++) {
        ctx.moveTo(0, y * scaleY);
        ctx.lineTo(width, y * scaleY);
      }
      
      ctx.stroke();
      
      // 单一阈值或多阈值处理
      if (Array.isArray(thresholds) && thresholds.length === 1) {
        // 单一阈值
        ctx.beginPath();
        ctx.lineWidth = 2;
        ctx.strokeStyle = 'red';
        
        // 使用generateContours函数生成等值线
        const contours = generateContours(data, thresholds[0], {
          smooth: false,
          saddleResolution: saddleResolution
        });
        
        if (contours && contours.coordinates) {
          // 单个等值线
          drawSingleContour(ctx, contours, scaleX, scaleY);
        }
        
        ctx.stroke();
      } else {
        // 多阈值
        // 使用不同颜色绘制每个阈值的等值线
        const colors = ['red', 'blue', 'green', 'purple', 'orange'];
        
        // 使用generateContours函数生成等值线
        const contours = generateContours(data, thresholds, {
          smooth: false,
          saddleResolution: saddleResolution
        });
        
        if (Array.isArray(contours)) {
          // 为每个阈值绘制等值线
          for (let i = 0; i < contours.length; i++) {
            ctx.beginPath();
            ctx.lineWidth = 2;
            ctx.strokeStyle = colors[i % colors.length];
            
            drawSingleContour(ctx, contours[i], scaleX, scaleY);
            
            ctx.stroke();
          }
        }
      }
    }
    
    // 绘制单个等值线
    function drawSingleContour(ctx, contour, scaleX, scaleY) {
      if (!contour || !contour.coordinates) return;
      
      for (const line of contour.coordinates) {
        if (line.length === 0) continue;
        
        ctx.moveTo(line[0][0] * scaleX, line[0][1] * scaleY);
        
        for (let i = 1; i < line.length; i++) {
          ctx.lineTo(line[i][0] * scaleX, line[i][1] * scaleY);
        }
      }
    }
    
    // 绘制等值面
    function drawContourBands(canvas, data, thresholds) {
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      
      ctx.clearRect(0, 0, width, height);
      
      // 使用generateContourBands函数生成等值面
      const bands = generateContourBands(data, thresholds, {
        smooth: false,
        saddleResolution: saddleResolution,
        extendToDataBounds: true,
        colorScale: ["#440154", "#482878", "#3e4989", "#31688e", "#26828e", "#1f9e89", "#35b779", "#6ece58", "#b5de2b", "#fde725"]
      });
      
      // 根据数据尺寸计算缩放比例
      const scaleX = width / (data[0].length - 1);
      const scaleY = height / (data.length - 1);
      
      // 绘制等值面
      if (Array.isArray(bands)) {
        // 从高值到低值绘制，以确保正确的绘制顺序
        for (let i = bands.length - 1; i >= 0; i--) {
          drawSingleBand(ctx, bands[i], scaleX, scaleY);
        }
      } else {
        drawSingleBand(ctx, bands, scaleX, scaleY);
      }
      
      // 绘制网格
      ctx.beginPath();
      ctx.strokeStyle = '#ccc';
      ctx.lineWidth = 0.5;
      
      for (let x = 0; x <= data[0].length; x++) {
        ctx.moveTo(x * scaleX, 0);
        ctx.lineTo(x * scaleX, height);
      }
      
      for (let y = 0; y <= data.length; y++) {
        ctx.moveTo(0, y * scaleY);
        ctx.lineTo(width, y * scaleY);
      }
      
      ctx.stroke();
    }
    
    // 绘制单个等值面
    function drawSingleBand(ctx, band, scaleX, scaleY) {
      if (!band || !band.coordinates) return;
      
      ctx.fillStyle = band.fill.color;
      
      for (const polygon of band.coordinates) {
        ctx.beginPath();
        
        // 绘制外轮廓
        const outerRing = polygon[0];
        if (outerRing && outerRing.length > 0) {
          ctx.moveTo(outerRing[0][0] * scaleX, outerRing[0][1] * scaleY);
          
          for (let i = 1; i < outerRing.length; i++) {
            ctx.lineTo(outerRing[i][0] * scaleX, outerRing[i][1] * scaleY);
          }
        }
        
        // 绘制内部孔洞
        for (let j = 1; j < polygon.length; j++) {
          const innerRing = polygon[j];
          if (innerRing && innerRing.length > 0) {
            ctx.moveTo(innerRing[0][0] * scaleX, innerRing[0][1] * scaleY);
            
            for (let i = 1; i < innerRing.length; i++) {
              ctx.lineTo(innerRing[i][0] * scaleX, innerRing[i][1] * scaleY);
            }
          }
        }
        
        ctx.closePath();
        ctx.fill();
        
        // 绘制轮廓线
        if (band.stroke) {
          ctx.strokeStyle = band.stroke.color;
          ctx.lineWidth = band.stroke.width;
          ctx.stroke();
        }
      }
    }
    
    // 生成数据和渲染
    function generateAndRender() {
      // 创建数据
      data = createSaddleData(saddleType);
      
      // 绘制数据网格
      drawDataGrid(data);
      
      // 获取阈值模式
      const thresholdMode = document.getElementById('thresholdMode').value;
      
      // 计算阈值
      let thresholds;
      if (thresholdMode === 'single') {
        thresholds = [0.5];
      } else {
        // 多阈值模式
        thresholds = [0.2, 0.4, 0.6, 0.8];
      }
      
      // 绘制等值线
      const contourLinesCanvas = document.getElementById('contourLinesCanvas');
      drawContourLines(contourLinesCanvas, data, thresholds);
      
      // 绘制等值面
      const contourBandsCanvas = document.getElementById('contourBandsCanvas');
      drawContourBands(contourBandsCanvas, data, thresholds);
    }
    
    // 绑定事件处理程序
    document.getElementById('toggleSaddleResolution').addEventListener('click', () => {
      saddleResolution = !saddleResolution;
      document.getElementById('toggleSaddleResolution').textContent = 
        `鞍点解析: ${saddleResolution ? '开启' : '关闭'}`;
      
      // 重新渲染
      generateAndRender();
    });
    
    document.getElementById('toggleSaddleType').addEventListener('click', () => {
      saddleType = saddleType === 5 ? 10 : 5;
      document.getElementById('toggleSaddleType').textContent = 
        `鞍点类型: ${saddleType}`;
      generateAndRender();
    });
    
    document.getElementById('regenerateData').addEventListener('click', generateAndRender);
    
    document.getElementById('thresholdMode').addEventListener('change', generateAndRender);
    
    // 初始化
    document.getElementById('toggleSaddleResolution').textContent = `鞍点解析: ${saddleResolution ? '开启' : '关闭'}`;
    document.getElementById('toggleSaddleType').textContent = `鞍点类型: ${saddleType}`;
    generateAndRender();
  </script>
</body>
</html>
