<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>等值线和等值面渲染示例</title>
  <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      background-color: #f5f5f5;
    }
    
    h1, h2 {
      color: #333;
    }
    
    .container {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
      margin-top: 20px;
    }
    
    .chart {
      background-color: white;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
      padding: 15px;
      width: calc(50% - 20px);
      min-width: 400px;
    }
    
    .chart h2 {
      margin-top: 0;
      border-bottom: 1px solid #eee;
      padding-bottom: 10px;
    }
    
    svg {
      display: block;
      margin: 0 auto;
    }
    
    .controls {
      margin-top: 20px;
      padding: 15px;
      background-color: white;
      border-radius: 5px;
      box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
    }
    
    .control-group {
      margin-bottom: 15px;
    }
    
    label {
      display: block;
      margin-bottom: 5px;
      font-weight: bold;
    }
    
    select, input {
      padding: 5px;
      width: 200px;
    }
    
    button {
      padding: 8px 15px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    
    button:hover {
      background-color: #45a049;
    }
  </style>
</head>
<body>
  <h1>等值线和等值面渲染示例</h1>
  <p>基于Marching Squares算法实现的等值线和等值面渲染</p>
  
  <div class="controls">
    <div class="control-group">
      <label for="colorScheme">颜色方案:</label>
      <select id="colorScheme">
        <option value="viridis">Viridis</option>
        <option value="plasma">Plasma</option>
        <option value="inferno">Inferno</option>
        <option value="magma">Magma</option>
        <option value="rainbow">Rainbow</option>
        <option value="blueRed">Blue to Red</option>
        <option value="hot">Hot</option>
        <option value="cool">Cool</option>
      </select>
    </div>
    
    <div class="control-group">
      <label for="thresholdCount">阈值数量:</label>
      <input type="range" id="thresholdCount" min="3" max="20" value="9">
      <span id="thresholdCountValue">9</span>
    </div>
    
    <div class="control-group">
      <label for="smoothFactor">平滑因子:</label>
      <input type="range" id="smoothFactor" min="0" max="100" value="25">
      <span id="smoothFactorValue">0.25</span>
    </div>
    
    <div class="control-group">
      <label for="fillOpacity">填充透明度:</label>
      <input type="range" id="fillOpacity" min="0" max="100" value="70">
      <span id="fillOpacityValue">0.7</span>
    </div>
    
    <div class="control-group">
      <label for="fillMode">填充模式:</label>
      <select id="fillMode">
        <option value="toself">To Self</option>
        <option value="tonext" selected>To Next</option>
        <option value="tozeroy">To Zero Y</option>
      </select>
    </div>
    
    <div class="control-group">
      <label for="showLines">显示轮廓线:</label>
      <input type="checkbox" id="showLines" checked>
    </div>
    
    <button id="updateButton">更新图表</button>
  </div>
  
  <div class="container">
    <div class="chart">
      <h2>等值线 (Contour Lines)</h2>
      <div id="contour-lines"></div>
    </div>
    
    <div class="chart">
      <h2>等值面 (Contour Bands)</h2>
      <div id="contour-bands"></div>
    </div>
    
    <div class="chart">
      <h2>填充等值线 (Filled Contours)</h2>
      <div id="filled-contours"></div>
    </div>
    
    <div class="chart">
      <h2>3D视图 (3D View)</h2>
      <div id="contour-3d"></div>
    </div>
  </div>
  
  <script type="module">
    import { generateContours, generateContourBands, generateFilledContours } from '../index.js';
    
    // 图表尺寸
    const width = 400;
    const height = 400;
    const margin = { top: 20, right: 20, bottom: 20, left: 20 };
    const innerWidth = width - margin.left - margin.right;
    const innerHeight = height - margin.top - margin.bottom;
    
    // 创建SVG元素
    const contourLinesSvg = d3.select('#contour-lines')
      .append('svg')
      .attr('width', width)
      .attr('height', height)
      .append('g')
      .attr('transform', `translate(${margin.left},${margin.top})`);
    
    const contourBandsSvg = d3.select('#contour-bands')
      .append('svg')
      .attr('width', width)
      .attr('height', height)
      .append('g')
      .attr('transform', `translate(${margin.left},${margin.top})`);
    
    const filledContoursSvg = d3.select('#filled-contours')
      .append('svg')
      .attr('width', width)
      .attr('height', height)
      .append('g')
      .attr('transform', `translate(${margin.left},${margin.top})`);
    
    // 创建示例数据
    function createSampleData(width, height) {
      const data = new Array(height);
      
      for (let y = 0; y < height; y++) {
        data[y] = new Array(width);
        for (let x = 0; x < width; x++) {
          // 创建一个简单的高斯分布
          const dx = x - width / 2;
          const dy = y - height / 2;
          const distance = Math.sqrt(dx * dx + dy * dy);
          
          // 添加一些波纹效果
          const wave = Math.sin(distance / 5) * 10;
          
          // 最终值
          data[y][x] = 100 - distance + wave;
        }
      }
      
      return data;
    }
    
    // 创建数据
    const dataWidth = 100;
    const dataHeight = 100;
    const data = createSampleData(dataWidth, dataHeight);
    
    // 获取数据范围
    let minValue = Infinity;
    let maxValue = -Infinity;
    
    for (let y = 0; y < dataHeight; y++) {
      for (let x = 0; x < dataWidth; x++) {
        const value = data[y][x];
        minValue = Math.min(minValue, value);
        maxValue = Math.max(maxValue, value);
      }
    }
    
    // 创建比例尺
    const xScale = d3.scaleLinear()
      .domain([0, dataWidth - 1])
      .range([0, innerWidth]);
    
    const yScale = d3.scaleLinear()
      .domain([0, dataHeight - 1])
      .range([innerHeight, 0]);
    
    // 创建地理路径生成器
    const geoPath = d3.geoPath()
      .projection(d3.geoTransform({
        point: function(x, y) {
          this.stream.point(xScale(x), yScale(y));
        }
      }));
    
    // 渲染函数
    function render() {
      // 获取控制参数
      const colorScheme = document.getElementById('colorScheme').value;
      const thresholdCount = parseInt(document.getElementById('thresholdCount').value);
      const smoothFactor = parseFloat(document.getElementById('smoothFactor').value) / 100;
      const fillOpacity = parseFloat(document.getElementById('fillOpacity').value) / 100;
      const fillMode = document.getElementById('fillMode').value;
      const showLines = document.getElementById('showLines').checked;
      
      // 更新显示值
      document.getElementById('thresholdCountValue').textContent = thresholdCount;
      document.getElementById('smoothFactorValue').textContent = smoothFactor.toFixed(2);
      document.getElementById('fillOpacityValue').textContent = fillOpacity.toFixed(2);
      
      // 计算阈值
      const step = (maxValue - minValue) / (thresholdCount + 1);
      const thresholds = Array.from({ length: thresholdCount }, (_, i) => minValue + step * (i + 1));
      
      // 渲染等值线
      renderContourLines(data, thresholds, {
        smooth: true,
        smoothFactor,
        colorScale: colorScheme
      });
      
      // 渲染等值面
      renderContourBands(data, thresholds, {
        smooth: true,
        smoothFactor,
        colorScale: colorScheme,
        fillOpacity,
        showLines
      });
      
      // 渲染填充等值线
      renderFilledContours(data, thresholds, {
        smooth: true,
        smoothFactor,
        colorScale: colorScheme,
        fillOpacity,
        fillMode,
        showLines
      });
    }
    
    // 渲染等值线
    function renderContourLines(data, thresholds, options) {
      // 生成等值线
      const contours = generateContours(data, thresholds, options);
      
      // 清除旧内容
      contourLinesSvg.selectAll('*').remove();
      
      // 渲染等值线
      contourLinesSvg.selectAll('path')
        .data(Array.isArray(contours) ? contours : [contours])
        .enter()
        .append('path')
        .attr('d', d => geoPath(d))
        .attr('fill', 'none')
        .attr('stroke', 'black')
        .attr('stroke-width', 1);
    }
    
    // 渲染等值面
    function renderContourBands(data, thresholds, options) {
      // 生成等值面
      const bands = generateContourBands(data, thresholds, options);
      
      // 清除旧内容
      contourBandsSvg.selectAll('*').remove();
      
      // 渲染等值面
      contourBandsSvg.selectAll('path')
        .data(Array.isArray(bands) ? bands : [bands])
        .enter()
        .append('path')
        .attr('d', d => geoPath(d))
        .attr('fill', d => d.fill ? d.fill.color : 'none')
        .attr('fill-opacity', d => d.fill ? d.fill.opacity : 0)
        .attr('stroke', d => d.stroke ? d.stroke.color : 'none')
        .attr('stroke-width', d => d.stroke ? d.stroke.width : 0);
    }
    
    // 渲染填充等值线
    function renderFilledContours(data, thresholds, options) {
      // 生成填充等值线
      const filled = generateFilledContours(data, thresholds, options);
      
      // 清除旧内容
      filledContoursSvg.selectAll('*').remove();
      
      // 渲染填充区域
      filledContoursSvg.selectAll('path.fill')
        .data(filled.fills)
        .enter()
        .append('path')
        .attr('class', 'fill')
        .attr('d', (d, i) => geoPath(
          { type: 'MultiPolygon', coordinates: [filled.coordinates[i]] }
        ))
        .attr('fill', d => d.color)
        .attr('fill-opacity', d => d.opacity);
      
      // 渲染轮廓线
      if (filled.lines && options.showLines) {
        filledContoursSvg.selectAll('path.line')
          .data(filled.lines)
          .enter()
          .append('path')
          .attr('class', 'line')
          .attr('d', d => geoPath({ type: 'MultiLineString', coordinates: d.coordinates }))
          .attr('fill', 'none')
          .attr('stroke', d => d.color)
          .attr('stroke-width', d => d.width);
      }
    }
    
    // 绑定更新按钮事件
    document.getElementById('updateButton').addEventListener('click', render);
    
    // 初始渲染
    render();
  </script>
</body>
</html>
