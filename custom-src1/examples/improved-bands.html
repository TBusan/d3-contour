<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>改进的等值面渲染</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .container {
      display: flex;
      flex-wrap: wrap;
    }
    .chart {
      margin: 10px;
      padding: 10px;
      border: 1px solid #ccc;
      width: 520px;
    }
    h1, h2 {
      color: #333;
    }
    canvas {
      border: 1px solid #ddd;
    }
    .controls {
      margin-bottom: 20px;
    }
    button, select {
      padding: 5px 10px;
      margin-right: 10px;
    }
  </style>
</head>
<body>
  <h1>改进的等值面渲染</h1>
  <p>修复了等值线和等值面不一致的问题，特别是处理了分离区域的渲染</p>
  
  <div class="controls">
    <button id="toggleDataType">切换数据类型</button>
    <button id="regenerateData">重新生成数据</button>
    <select id="thresholdCount">
      <option value="5">5 个阈值</option>
      <option value="10" selected>10 个阈值</option>
      <option value="15">15 个阈值</option>
      <option value="20">20 个阈值</option>
    </select>
  </div>
  
  <div class="container">
    <div class="chart">
      <h2>等值线 (Contour Lines)</h2>
      <canvas id="contourLinesCanvas" width="500" height="500"></canvas>
    </div>
    
    <div class="chart">
      <h2>等值面 (Contour Bands)</h2>
      <canvas id="contourBandsCanvas" width="500" height="500"></canvas>
    </div>
  </div>

  <script type="module">
    import { generateContours } from '../contour-lines.js';
    import { generateContourBands } from '../contour-bands.js';
    
    // 全局变量
    let currentDataType = 'gaussian'; // 'gaussian' 或 'complex'
    let data = [];
    let width = 100;
    let height = 100;
    
    // 创建高斯分布数据
    function createGaussianData(width, height) {
      const data = new Array(height);
      for (let y = 0; y < height; y++) {
        data[y] = new Array(width);
        for (let x = 0; x < width; x++) {
          // 距离中心的标准化距离
          const dx = x - width / 2;
          const dy = y - height / 2;
          const distance = Math.sqrt(dx * dx + dy * dy) / (Math.sqrt(width * width + height * height) / 2);
          
          // 添加一些高斯随机噪声
          const noise = Math.random() * 0.05;
          
          // 生成高斯分布样式的数据
          data[y][x] = Math.exp(-5 * distance * distance) + noise;
        }
      }
      return data;
    }
    
    // 创建复杂数据（包含多个峰值和山谷）
    function createComplexData(width, height) {
      const data = new Array(height);
      
      // 创建多个峰值点
      const peaks = [
        { x: width * 0.5, y: height * 0.5, strength: 1.0 },  // 中心
        { x: width * 0.3, y: height * 0.3, strength: 0.7 },  // 左上
        { x: width * 0.7, y: height * 0.7, strength: 0.8 },  // 右下
        { x: width * 0.2, y: height * 0.8, strength: 0.6 }   // 左下
      ];
      
      for (let y = 0; y < height; y++) {
        data[y] = new Array(width);
        for (let x = 0; x < width; x++) {
          // 初始值
          let value = 0;
          
          // 添加每个峰值的影响
          for (const peak of peaks) {
            const dx = x - peak.x;
            const dy = y - peak.y;
            const distance = Math.sqrt(dx * dx + dy * dy);
            
            // 使用高斯函数创建峰值
            value += peak.strength * Math.exp(-distance * distance / (width * 10));
          }
          
          // 添加一些波纹效果
          const distToCenter = Math.sqrt(Math.pow(x - width/2, 2) + Math.pow(y - height/2, 2));
          const ripple = Math.sin(distToCenter / 5) * 0.1;
          
          // 添加一些随机噪声
          const noise = Math.random() * 0.05;
          
          // 最终值
          data[y][x] = value + ripple + noise;
        }
      }
      
      return data;
    }
    
    // 绘制等值线
    function drawContourLines(canvas, data, thresholds) {
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      
      ctx.clearRect(0, 0, width, height);
      ctx.lineWidth = 1;
      ctx.strokeStyle = 'black';
      
      // 使用generateContours函数生成等值线
      const contours = generateContours(data, thresholds, {
        smooth: true,
        smoothFactor: 0.25,
        extendToDataBounds: true
      });
      
      // 根据数据尺寸计算缩放比例
      const scaleX = width / (data[0].length - 1);
      const scaleY = height / (data.length - 1);
      
      // 绘制等值线
      ctx.beginPath();
      
      if (Array.isArray(contours)) {
        for (const contour of contours) {
          drawSingleContour(ctx, contour, scaleX, scaleY);
        }
      } else {
        drawSingleContour(ctx, contours, scaleX, scaleY);
      }
      
      ctx.stroke();
    }
    
    // 绘制单个等值线
    function drawSingleContour(ctx, contour, scaleX, scaleY) {
      if (!contour || !contour.coordinates) return;
      
      for (const line of contour.coordinates) {
        if (line.length === 0) continue;
        
        ctx.moveTo(line[0][0] * scaleX, line[0][1] * scaleY);
        
        for (let i = 1; i < line.length; i++) {
          ctx.lineTo(line[i][0] * scaleX, line[i][1] * scaleY);
        }
      }
    }
    
    // 绘制等值面
    function drawContourBands(canvas, data, thresholds) {
      const ctx = canvas.getContext('2d');
      const width = canvas.width;
      const height = canvas.height;
      
      ctx.clearRect(0, 0, width, height);
      
      // 使用generateContourBands函数生成等值面
      const bands = generateContourBands(data, thresholds, {
        smooth: true,
        smoothFactor: 0.25,
        extendToDataBounds: true,
        colorScale: ["#440154", "#482878", "#3e4989", "#31688e", "#26828e", "#1f9e89", "#35b779", "#6ece58", "#b5de2b", "#fde725"]
      });
      
      // 根据数据尺寸计算缩放比例
      const scaleX = width / (data[0].length - 1);
      const scaleY = height / (data.length - 1);
      
      // 绘制等值面
      if (Array.isArray(bands)) {
        // 从高值到低值绘制，以确保正确的绘制顺序
        for (let i = bands.length - 1; i >= 0; i--) {
          drawSingleBand(ctx, bands[i], scaleX, scaleY);
        }
      } else {
        drawSingleBand(ctx, bands, scaleX, scaleY);
      }
    }
    
    // 绘制单个等值面
    function drawSingleBand(ctx, band, scaleX, scaleY) {
      if (!band || !band.coordinates) return;
      
      ctx.fillStyle = band.fill.color;
      
      for (const polygon of band.coordinates) {
        ctx.beginPath();
        
        // 绘制外轮廓
        const outerRing = polygon[0];
        if (outerRing && outerRing.length > 0) {
          ctx.moveTo(outerRing[0][0] * scaleX, outerRing[0][1] * scaleY);
          
          for (let i = 1; i < outerRing.length; i++) {
            ctx.lineTo(outerRing[i][0] * scaleX, outerRing[i][1] * scaleY);
          }
        }
        
        // 绘制内部孔洞
        for (let j = 1; j < polygon.length; j++) {
          const innerRing = polygon[j];
          if (innerRing && innerRing.length > 0) {
            ctx.moveTo(innerRing[0][0] * scaleX, innerRing[0][1] * scaleY);
            
            for (let i = 1; i < innerRing.length; i++) {
              ctx.lineTo(innerRing[i][0] * scaleX, innerRing[i][1] * scaleY);
            }
          }
        }
        
        ctx.closePath();
        ctx.fill();
        
        // 绘制轮廓线
        if (band.stroke) {
          ctx.strokeStyle = band.stroke.color;
          ctx.lineWidth = band.stroke.width;
          ctx.stroke();
        }
      }
    }
    
    // 生成数据和渲染
    function generateAndRender() {
      // 创建数据
      if (currentDataType === 'gaussian') {
        data = createGaussianData(width, height);
      } else {
        data = createComplexData(width, height);
      }
      
      // 获取阈值数量
      const thresholdCount = parseInt(document.getElementById('thresholdCount').value);
      
      // 计算数据范围
      let minValue = Infinity;
      let maxValue = -Infinity;
      
      for (let y = 0; y < height; y++) {
        for (let x = 0; x < width; x++) {
          const value = data[y][x];
          minValue = Math.min(minValue, value);
          maxValue = Math.max(maxValue, value);
        }
      }
      
      // 计算阈值
      const step = (maxValue - minValue) / (thresholdCount + 1);
      const thresholds = Array.from({ length: thresholdCount }, (_, i) => minValue + step * (i + 1));
      
      // 获取画布元素
      const contourLinesCanvas = document.getElementById('contourLinesCanvas');
      const contourBandsCanvas = document.getElementById('contourBandsCanvas');
      
      // 绘制等值线
      drawContourLines(contourLinesCanvas, data, thresholds);
      
      // 绘制等值面
      drawContourBands(contourBandsCanvas, data, thresholds);
    }
    
    // 绑定事件处理程序
    document.getElementById('toggleDataType').addEventListener('click', () => {
      currentDataType = currentDataType === 'gaussian' ? 'complex' : 'gaussian';
      document.getElementById('toggleDataType').textContent = 
        `切换数据类型 (当前: ${currentDataType === 'gaussian' ? '高斯分布' : '复杂数据'})`;
      generateAndRender();
    });
    
    document.getElementById('regenerateData').addEventListener('click', generateAndRender);
    
    document.getElementById('thresholdCount').addEventListener('change', generateAndRender);
    
    // 初始化
    document.getElementById('toggleDataType').textContent = 
      `切换数据类型 (当前: ${currentDataType === 'gaussian' ? '高斯分布' : '复杂数据'})`;
    generateAndRender();
  </script>
</body>
</html>
