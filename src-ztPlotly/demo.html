<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enhanced Contour Demo</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
        }
        #controls {
            margin-bottom: 20px;
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
        }
        .control-group {
            margin-right: 20px;
        }
        #visualization {
            width: 100%;
            height: 600px;
            border: 1px solid #ccc;
            position: relative;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
        }
        #exportOutput {
            width: 100%;
            height: 200px;
            margin-top: 20px;
            font-family: monospace;
            font-size: 12px;
            white-space: pre;
            overflow: auto;
            border: 1px solid #ccc;
            padding: 10px;
        }
        .button-group {
            margin-top: 20px;
        }
        button {
            padding: 8px 16px;
            margin-right: 10px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>Enhanced Contour Demo</h1>
    <p>Demonstration of the enhanced contour library using test data</p>

    <div id="controls">
        <div class="control-group">
            <label for="contourMode">Contour Mode:</label>
            <select id="contourMode">
                <option value="lines">Lines</option>
                <option value="surfaces" selected>Surfaces</option>
                <option value="both">Both</option>
            </select>
        </div>

        <div class="control-group">
            <label for="smoothingLevel">Smoothing Level:</label>
            <input type="range" id="smoothingLevel" min="0" max="5" step="0.1" value="1.0">
            <span id="smoothingValue">1.0</span>
        </div>

        <div class="control-group">
            <label for="contourLevels">Contour Levels:</label>
            <input type="number" id="contourLevels" min="3" max="50" value="10" style="width: 60px;">
        </div>

        <div class="control-group">
            <label for="handleNulls">Handle Null Values:</label>
            <input type="checkbox" id="handleNulls" checked>
        </div>

        <div class="control-group">
            <button id="generateButton">Generate Contours</button>
        </div>
    </div>

    <div id="visualization">
        <canvas id="contourCanvas"></canvas>
    </div>

    <div class="button-group">
        <button id="exportGeoJSON">Export GeoJSON</button>
        <button id="copyJSON">Copy to Clipboard</button>
        <button id="downloadJSON">Download GeoJSON</button>
    </div>

    <textarea id="exportOutput" readonly placeholder="GeoJSON output will appear here"></textarea>

    <script type="module">
        import enhancedContours, { toGeoJSON } from './enhanced-contour.js';
        import { contourData } from './testData1.js';

        // Global variables
        let generatedContours = null;
        const canvas = document.getElementById('contourCanvas');
        const ctx = canvas.getContext('2d');
        let mode = 'lines';
        // DOM elements
        const contourMode = document.getElementById('contourMode');
        const smoothingLevel = document.getElementById('smoothingLevel');
        const smoothingValue = document.getElementById('smoothingValue');
        const contourLevels = document.getElementById('contourLevels');
        const handleNulls = document.getElementById('handleNulls');
        const generateButton = document.getElementById('generateButton');
        const exportGeoJSONButton = document.getElementById('exportGeoJSON');
        const copyJSONButton = document.getElementById('copyJSON');
        const downloadJSONButton = document.getElementById('downloadJSON');
        const exportOutput = document.getElementById('exportOutput');

        // Event listeners
        smoothingLevel.addEventListener('input', () => {
            smoothingValue.textContent = smoothingLevel.value;
        });

        generateButton.addEventListener('click', generateContours);
        exportGeoJSONButton.addEventListener('click', exportGeoJSON);
        copyJSONButton.addEventListener('click', copyToClipboard);
        downloadJSONButton.addEventListener('click', downloadGeoJSON);

        // Initialize
        setupCanvas();
        generateContours();

        function setupCanvas() {
            // Set canvas size based on parent div
            const container = document.getElementById('visualization');
            canvas.width = container.offsetWidth;
            canvas.height = container.offsetHeight;

            // Handle window resize
            window.addEventListener('resize', () => {
                canvas.width = container.offsetWidth;
                canvas.height = container.offsetHeight;
                if (generatedContours) {
                    drawContours(generatedContours);
                }
            });
        }

        function generateContours() {
            // Get user settings
            mode = contourMode.value;
            const smooth = parseFloat(smoothingLevel.value);
            const levels = parseInt(contourLevels.value);
            const useNullMask = handleNulls.checked;
            
            // Process the data
            const { data } = contourData;
            const { x, y, v } = data;
            const dx = x.length;
            const dy = y.length;

            // Log data dimensions for debugging
            console.log(`Data dimensions: ${dx}x${dy}`);
            console.log('Sample data point:', v[0][0]);

            // Create a proper 2D grid for the contour generator
            const values = new Array(dx * dy);
            
            // Fill the values array with data from the grid
            for (let j = 0; j < dy; j++) {
                for (let i = 0; i < dx; i++) {
                    // Store in row-major order (y * width + x)
                    values[j * dx + i] = v[j][i];
                }
            }

            // Create null mask if needed
            let nullMask = null;
            if (useNullMask) {
                nullMask = values.map(val => val !== null && isFinite(val) ? 1 : 0);
            }

            // Create contour generator with proper size
            const contours = enhancedContours()
                .size([dx, dy])
                .thresholds(generateThresholds(values, levels))
                .smooth(smooth)
                .mode(mode);

            if (nullMask) {
                contours.nullMask(nullMask);
            }

            // Generate contours
            generatedContours = contours(values);
            
            // Log the generated contours for debugging
            console.log('Generated contours:', generatedContours);
            
            // Draw the contours
            drawContours(generatedContours);
        }

        // Generate evenly spaced thresholds from the data
        function generateThresholds(values, count) {
            // Find min and max values
            let min = Infinity;
            let max = -Infinity;
            
            for (let i = 0; i < values.length; i++) {
                const val = values[i];
                if (val != null && isFinite(val)) {
                    min = Math.min(min, val);
                    max = Math.max(max, val);
                }
            }
            
            // Generate evenly spaced thresholds
            const step = (max - min) / (count + 1);
            const thresholds = [];
            
            for (let i = 1; i <= count; i++) {
                thresholds.push(min + i * step);
            }
            
            console.log('Generated thresholds:', thresholds);
            return thresholds;
        }

        function drawContours(contours) {
            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Get data dimensions for scaling
            const { data } = contourData;
            const { x, y, v, zmin, zmax } = data;
            const dx = x.length;
            const dy = y.length;

            // Calculate scale to fit canvas
            const padding = 30;
            const scaleX = (canvas.width - 2 * padding) / dx;
            const scaleY = (canvas.height - 2 * padding) / dy;
            const scale = Math.min(scaleX, scaleY);

            // Drawing constants
            const mode = contourMode.value;
            const colorScale = d3ColorScale(zmin, zmax);

            // Draw based on mode
            if (mode === 'lines' || mode === 'both') {
                drawContourLines(contours, scale, padding, colorScale);
            }
            
            if (mode === 'surfaces' || mode === 'both') {
                drawContourSurfaces(contours, scale, padding, colorScale);
            }

            // Draw data points
            drawDataPoints(data, scale, padding);
        }

        function drawContourLines(contours, scale, padding, colorScale) {
            const items = mode === 'both' ? contours.map(c => c.lines) : contours;
            
            items.forEach((contour, i) => {
                const value = contour.value;
                const color = colorScale(value);
                
                ctx.strokeStyle = color;
                ctx.lineWidth = 1.5;
                
                // Skip if coordinates are empty
                if (!contour.coordinates || contour.coordinates.length === 0) {
                    console.warn(`No coordinates for contour with value ${value}`);
                    return;
                }
                
                contour.coordinates.forEach(line => {
                    // Skip empty or invalid lines
                    if (!line || line.length < 2) return;
                    
                    ctx.beginPath();
                    
                    // Draw the line
                    line.forEach((point, i) => {
                        const [x, y] = point;
                        const screenX = x * scale + padding;
                        const screenY = y * scale + padding;
                        
                        if (i === 0) {
                            ctx.moveTo(screenX, screenY);
                        } else {
                            ctx.lineTo(screenX, screenY);
                        }
                    });
                    
                    ctx.stroke();
                });
            });
        }

        function drawContourSurfaces(contours, scale, padding, colorScale) {
            const items = mode === 'both' ? contours.map(c => c.surfaces) : contours;
            
            // Draw from high to low for proper layering
            for (let i = items.length - 1; i >= 0; i--) {
                const contour = items[i];
                const value = contour.value;
                const color = colorScale(value);
                const alpha = 0.7;  // Semi-transparent
                
                ctx.fillStyle = hexToRgba(color, alpha);
                ctx.strokeStyle = color;
                ctx.lineWidth = 0.5;
                
                // Skip if coordinates are empty
                if (!contour.coordinates || contour.coordinates.length === 0) {
                    console.warn(`No coordinates for contour surface with value ${value}`);
                    continue;
                }
                
                contour.coordinates.forEach(polygon => {
                    // Skip empty polygons
                    if (!polygon || polygon.length === 0) return;
                    
                    // First ring is the exterior, rest are holes
                    const exterior = polygon[0];
                    const holes = polygon.slice(1);
                    
                    // Skip if exterior is empty
                    if (!exterior || exterior.length === 0) return;
                    
                    ctx.beginPath();
                    
                    // Draw exterior ring
                    exterior.forEach((point, i) => {
                        const [x, y] = point;
                        const screenX = x * scale + padding;
                        const screenY = y * scale + padding;
                        
                        if (i === 0) {
                            ctx.moveTo(screenX, screenY);
                        } else {
                            ctx.lineTo(screenX, screenY);
                        }
                    });
                    
                    // Draw holes (in opposite direction)
                    holes.forEach(hole => {
                        if (!hole || hole.length === 0) return;
                        
                        // Move to the start of the hole
                        const [hx, hy] = hole[0];
                        ctx.moveTo(hx * scale + padding, hy * scale + padding);
                        
                        // Draw the hole (counter-clockwise)
                        for (let i = 1; i < hole.length; i++) {
                            const [x, y] = hole[i];
                            ctx.lineTo(x * scale + padding, y * scale + padding);
                        }
                    });
                    
                    ctx.closePath();
                    ctx.fill();
                    ctx.stroke(); // Add an outline to make the polygons more visible
                });
            }
        }

        function drawDataPoints(data, scale, padding) {
            const { x, y, v } = data;
            
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            
            for (let j = 0; j < y.length; j++) {
                for (let i = 0; i < x.length; i++) {
                    if (v[j][i] !== null) {
                        const screenX = i * scale + padding;
                        const screenY = j * scale + padding;
                        
                        ctx.beginPath();
                        ctx.arc(screenX, screenY, 1.5, 0, Math.PI * 2);
                        ctx.fill();
                    }
                }
            }
        }

        function exportGeoJSON() {
            if (!generatedContours) {
                alert('No contours generated yet!');
                return;
            }
            
            // Convert to proper GeoJSON
            let geoJSON;
            
            try {
                // Import the toGeoJSON helper from the enhanced-contour.js module
                geoJSON = toGeoJSON(generatedContours, {
                    source: 'enhanced-contour',
                    timestamp: new Date().toISOString()
                });
                
                // Format JSON with indentation for readability
                const formattedJSON = JSON.stringify(geoJSON, null, 2);
                
                // Display in the output area
                exportOutput.value = formattedJSON;
                
                console.log('GeoJSON export successful');
            } catch (error) {
                console.error('Error exporting GeoJSON:', error);
                alert('Error exporting GeoJSON: ' + error.message);
            }
        }

        function copyToClipboard() {
            if (!exportOutput.value) {
                alert('Export GeoJSON first!');
                return;
            }
            
            exportOutput.select();
            document.execCommand('copy');
            alert('Copied to clipboard!');
        }

        function downloadGeoJSON() {
            if (!exportOutput.value) {
                alert('Export GeoJSON first!');
                return;
            }
            
            const blob = new Blob([exportOutput.value], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = 'contour-export.geojson';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        // Utility functions
        function d3ColorScale(min, max) {
            // Simple version of d3 color scale
            const colors = [
                '#00441b', '#006d2c', '#238b45', '#41ae76', 
                '#66c2a4', '#99d8c9', '#ccece6', '#e5f5f9', 
                '#f7fcfd', '#fff7fb', '#f1eef6', '#d7b5d8', 
                '#df65b0', '#dd1c77', '#980043', '#67001f'
            ];
            
            return function(value) {
                const normalized = (value - min) / (max - min);
                const index = Math.min(
                    colors.length - 1,
                    Math.max(0, Math.floor(normalized * colors.length))
                );
                return colors[index];
            };
        }

        function hexToRgba(hex, alpha) {
            const r = parseInt(hex.slice(1, 3), 16);
            const g = parseInt(hex.slice(3, 5), 16);
            const b = parseInt(hex.slice(5, 7), 16);
            return `rgba(${r}, ${g}, ${b}, ${alpha})`;
        }
    </script>
</body>
</html>
